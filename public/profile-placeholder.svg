<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="70" fill="url(#circle)" opacity="0.3"/>
  <circle cx="200" cy="150" r="60" fill="url(#circle)" opacity="0.5"/>
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGrad)">RA</text>
  <path d="M120 280 C120 240, 280 240, 280 280 L280 320 C280 340, 120 340, 120 320 Z" fill="url(#circle)" opacity="0.3"/>
  <!-- Code symbols floating around -->
  <text x="60" y="80" font-family="monospace" font-size="20" fill="#6366f1" opacity="0.4">&lt;/&gt;</text>
  <text x="300" y="100" font-family="monospace" font-size="16" fill="#a855f7" opacity="0.4">{...}</text>
  <text x="320" y="300" font-family="monospace" font-size="18" fill="#ec4899" opacity="0.3">( )</text>
  <text x="50" y="320" font-family="monospace" font-size="14" fill="#6366f1" opacity="0.3">[ ]</text>
</svg>

