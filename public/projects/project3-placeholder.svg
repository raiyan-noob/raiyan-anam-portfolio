    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <!-- AI Brain/Document icon -->
  <circle cx="400" cy="170" r="65" fill="url(#accent3)" opacity="0.15"/>
  <circle cx="400" cy="170" r="45" fill="url(#accent3)" opacity="0.1"/>
  <!-- Document lines -->
  <rect x="370" y="140" width="60" height="6" rx="3" fill="#ec4899" opacity="0.5"/>
  <rect x="375" y="155" width="50" height="4" rx="2" fill="#a855f7" opacity="0.4"/>
  <rect x="378" y="168" width="44" height="4" rx="2" fill="#6366f1" opacity="0.4"/>
  <rect x="380" y="181" width="40" height="4" rx="2" fill="#ec4899" opacity="0.3"/>
  <rect x="375" y="194" width="50" height="4" rx="2" fill="#a855f7" opacity="0.3"/>
  <!-- Neural network dots -->
  <circle cx="300" cy="120" r="4" fill="#ec4899" opacity="0.4"/>
  <circle cx="320" cy="200" r="3" fill="#a855f7" opacity="0.4"/>
  <circle cx="500" cy="130" r="4" fill="#6366f1" opacity="0.4"/>
