  <line x1="500" y1="130" x2="430" y2="150" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <!-- Blog lines -->
  <rect x="200" y="270" width="400" height="8" rx="4" fill="#6366f1" opacity="0.1"/>
  <rect x="200" y="290" width="350" height="6" rx="3" fill="#a855f7" opacity="0.08"/>
  <rect x="200" y="308" width="380" height="6" rx="3" fill="#ec4899" opacity="0.08"/>
  <rect x="200" y="326" width="300" height="6" rx="3" fill="#6366f1" opacity="0.08"/>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#f9a8d4">BlogGenius</text>
