<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Kanban board columns -->
  <rect x="120" y="80" width="170" height="260" rx="8" fill="#a855f7" opacity="0.1" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="315" y="80" width="170" height="260" rx="8" fill="#ec4899" opacity="0.1" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="510" y="80" width="170" height="260" rx="8" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Column headers -->
  <rect x="130" y="90" width="150" height="30" rx="4" fill="#a855f7" opacity="0.3"/>
  <rect x="325" y="90" width="150" height="30" rx="4" fill="#ec4899" opacity="0.3"/>
  <rect x="520" y="90" width="150" height="30" rx="4" fill="#6366f1" opacity="0.3"/>
  <!-- Cards -->
  <rect x="130" y="130" width="150" height="50" rx="6" fill="#a855f7" opacity="0.15"/>
  <rect x="130" y="190" width="150" height="50" rx="6" fill="#a855f7" opacity="0.15"/>
  <rect x="130" y="250" width="150" height="50" rx="6" fill="#a855f7" opacity="0.15"/>
  <rect x="325" y="130" width="150" height="50" rx="6" fill="#ec4899" opacity="0.15"/>
  <rect x="325" y="190" width="150" height="50" rx="6" fill="#ec4899" opacity="0.15"/>
  <rect x="520" y="130" width="150" height="50" rx="6" fill="#6366f1" opacity="0.15"/>
  <rect x="520" y="190" width="150" height="50" rx="6" fill="#6366f1" opacity="0.15"/>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c4b5fd">TaskFlow</text>
</svg>

